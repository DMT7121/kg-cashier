<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script>
    (function() {
      var hostname = window.location.hostname;
      var isLocal = hostname === 'localhost' || 
                    hostname === '127.0.0.1' || 
                    /^(192\.168\.|10\.|172\.(1[6-9]|2[0-9]|3[0-1])\.)/.test(hostname) || 
                    hostname.slice(-6) === '.local';
      if (!isLocal && hostname !== 'kg-cashier.pages.dev') {
        window.location.replace('https://kg-cashier.pages.dev' + window.location.pathname + window.location.search + window.location.hash);
      }
    })();
  </script>
  <title>KG Order — Nhân viên phục vụ</title>
  <meta name="description" content="App gọi món dành cho nhân viên phục vụ KING's GRILL — Chọn bàn, gọi món, báo bếp nhanh chóng.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700;800&subset=vietnamese&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/staff.webmanifest">
  <meta name="theme-color" content="#111318">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KG Order">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/staff-main.ts"></script>
</body>
</html>
