<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KG Order — Nhân viên phục vụ</title>
  <meta name="description" content="App gọi món dành cho nhân viên phục vụ KING's GRILL — Chọn bàn, gọi món, báo bếp nhanh chóng.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700;800&subset=vietnamese&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/staff.webmanifest">
  <meta name="theme-color" content="#111318">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KG Order">
</head>
<body>
  <div class="staff-app">
    <!-- Minimal header for staff -->
    <header class="staff-header" id="staffHeader">
      <div class="staff-header-left">
        <img src="/android-chrome-192x192.png" alt="KG" class="staff-logo">
        <div>
          <div class="staff-brand">KING's GRILL</div>
          <div class="staff-role">📱 Nhân viên phục vụ</div>
        </div>
      </div>
      <div class="staff-header-right">
        <span class="staff-clock" id="staffClock"></span>
      </div>
    </header>

    <!-- POS view renders here -->
    <div class="staff-view" id="viewContainer"></div>
  </div>

  <!-- Modal Overlay (required by pos.js) -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content" id="modalBody"></div>
  </div>

  <script type="module" src="/src/staff-main.js"></script>
</body>
</html>
